<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard</title>

    <style>
        div#chessboard {
            font-size: 0;
            display: inline-block;

            border: 1px solid;
            border-left-color: gray;
            border-top-color: gray;
            border-right-color: black;
            border-bottom-color: black;
            padding-inline: 0.0625rem;

            --size: 1.685rem;
            --odd-color: white;
            --even-color: black;

            &>div {
                display: block;

                margin-block: 0.125rem;

                &:nth-child(odd) {
                    --child-odd-color: var(--odd-color);
                    --child-even-color: var(--even-color);
                }

                &:nth-child(even) {
                    --child-odd-color: var(--even-color);
                    --child-even-color: var(var(--odd-color))
                }

                &>div {
                    display: inline-block;

                    margin-inline: 0.0625rem;

                    width: var(--size);
                    height: var(--size);
                    border: 1px solid;
                    border-left-color: black;
                    border-top-color: black;
                    border-right-color: gray;
                    border-bottom-color: gray;

                    &:nth-child(odd) {
                        background-color: var(--child-odd-color);
                    }

                    &:nth-child(even) {
                        background-color: var(--child-even-color);
                    }
                }
            }
        }
    </style>
</head>
