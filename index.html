<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard</title>

    <style>
        div#chessboard {
            font-size: 0;
            display: grid;
            grid-template-columns: repeat(8, var(--size));
            grid-template-rows: repeat(8, var(--size));
            width: fit-content;

            border: 1px solid;
            border-left-color: gray;
            border-top-color: gray;
            border-right-color: black;
            border-bottom-color: black;
            padding: 0.125rem;
            gap: 0.125rem;

            --size: 1.8125rem;
            --odd-color: white;
            --even-color: black;

            &>div {
                border: 1px solid;
                border-left-color: black;
                border-top-color: black;
                border-right-color: gray;
                border-bottom-color: gray;

                /* default mapping: odd cells -> odd-color, even cells -> even-color */
                --child-odd-color: var(--odd-color);
                --child-even-color: var(--even-color);

                /* 8 cells/row is even, so every row repeats the previous row's
                parity -> a plain odd/even paint gives vertical stripes, not a
                checker. Swap the mapping on every 2nd row (cells 9-16, 25-32,
                41-48, 57-64) so the colors offset and the board checkers. */
                &:nth-child(16n+9),
                &:nth-child(16n+10),
                &:nth-child(16n+11),
                &:nth-child(16n+12),
                &:nth-child(16n+13),
                &:nth-child(16n+14),
                &:nth-child(16n+15),
                &:nth-child(16n) {
                    --child-odd-color: var(--even-color);
                    --child-even-color: var(--odd-color);
                }

                /* paint from the (possibly swapped) parity var */
                &:nth-child(odd) {
                    background-color: var(--child-odd-color);
                }

                &:nth-child(even) {
                    background-color: var(--child-even-color);
                }
            }
        }
    </style>
</head>
